<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>셀카피 비밀번호 재설정</title>
  </head>
  <body style="margin:0;padding:0;background:#efeae2;font-family:'Apple SD Gothic Neo',Malgun Gothic,Segoe UI,sans-serif;color:#102033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#efeae2;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffcf7;border:1px solid #d7d2c8;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="background:#0f7a5f;padding:22px 28px;">
                <p style="margin:0;font-size:22px;font-weight:800;color:#ffffff;">셀카피</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px 12px;">
                <h1 style="margin:0;font-size:22px;line-height:1.35;">비밀번호를 재설정할까요?</h1>
                <p style="margin:14px 0 0;font-size:15px;line-height:1.7;color:#3a4a5c;">
                  아래 버튼을 누르면 새 비밀번호를 설정할 수 있어요.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 28px 24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#0f7a5f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 28px;border-radius:999px;">
                  비밀번호 재설정
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;color:#0f7a5f;">
                  {{ .ConfirmationURL }}
                </p>
                <p style="margin:18px 0 0;font-size:12px;color:#3a4a5c;">
                  요청하지 않았다면 이 메일은 무시하세요.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
