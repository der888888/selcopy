<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>셀카피 이메일 인증</title>
  </head>
  <body style="margin:0;padding:0;background:#efeae2;font-family:'Apple SD Gothic Neo',Malgun Gothic,Segoe UI,sans-serif;color:#102033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#efeae2;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffcf7;border:1px solid #d7d2c8;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="background:#0f7a5f;padding:22px 28px;">
                <p style="margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">셀카피</p>
                <p style="margin:6px 0 0;font-size:13px;color:#dff3ec;">스마트스토어·쿠팡 카피 AI</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 28px 12px;">
                <h1 style="margin:0;font-size:22px;line-height:1.35;letter-spacing:-0.02em;">이메일 인증을 완료해 주세요</h1>
                <p style="margin:14px 0 0;font-size:15px;line-height:1.7;color:#3a4a5c;">
                  셀카피 가입을 환영합니다.<br />
                  아래 버튼을 눌러 이메일을 인증하면 바로 시작할 수 있어요.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 28px 24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#0f7a5f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 28px;border-radius:999px;">
                  이메일 인증하기
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#3a4a5c;">
                  버튼이 안 되면 아래 링크를 브라우저에 붙여넣기 하세요.
                </p>
                <p style="margin:8px 0 0;font-size:12px;line-height:1.5;word-break:break-all;color:#0f7a5f;">
                  {{ .ConfirmationURL }}
                </p>
                <p style="margin:18px 0 0;font-size:12px;line-height:1.6;color:#3a4a5c;">
                  본인이 요청하지 않았다면 이 메일은 무시하셔도 됩니다.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px;border-top:1px solid #d7d2c8;background:#f7f4ee;">
                <p style="margin:0;font-size:12px;color:#3a4a5c;">
                  © 셀카피 · <a href="https://selcopy.vercel.app" style="color:#0f7a5f;text-decoration:none;">selcopy.vercel.app</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
